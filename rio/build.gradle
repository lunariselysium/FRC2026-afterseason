import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id "java"
    id "edu.wpi.first.GradleRIO" version "2026.2.1"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

def ROBOT_MAIN_CLASS = "frc.robot.Main"

// Define my targets (RoboRIO) and artifacts (deployable files)
// This is added by GradleRIO's backing project DeployUtils.
deploy {
    targets {
        roborio(getTargetTypeClass('RoboRIO')) {
            // Team number is loaded either from the .wpilib/wpilib_preferences.json
            // or from command line. If not found an exception will be thrown.
            // You can use getTeamOrDefault(team) instead of getTeamNumber if you
            // want to store a team number in this file.
            team = project.frc.getTeamNumber()
            debug = project.frc.getDebugOrDefault(false)

            artifacts {
                // First part is artifact name, 2nd is artifact type
                // getTargetTypeClass is a shortcut to get the class type using a string

                frcJava(getArtifactTypeClass('FRCJavaArtifact')) {
                }

                // Static files artifact
                frcStaticFileDeploy(getArtifactTypeClass('FileTreeArtifact')) {
                    files = project.fileTree('src/main/deploy')
                    directory = '/home/lvuser/deploy'
                    deleteOldFiles = false // Change to true to delete files on roboRIO that no
                                           // longer exist in deploy directory of this project
                }
            }
        }
    }
}

def deployArtifact = deploy.targets.roborio.artifacts.frcJava

// Set to true to use debug for all targets including JNI, which will drastically impact
// performance.
wpi.java.debugJni = false

// Set this to true to enable desktop support.
def includeDesktopSupport = true

// Defining my dependencies. In this case, WPILib (+ friends), and vendor libraries.
// Also defines JUnit 5.
dependencies {
    annotationProcessor wpi.java.deps.wpilibAnnotations()
    implementation wpi.java.deps.wpilib()
    implementation wpi.java.vendor.java()

    roborioDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.roborio)
    roborioDebug wpi.java.vendor.jniDebug(wpi.platforms.roborio)

    roborioRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.roborio)
    roborioRelease wpi.java.vendor.jniRelease(wpi.platforms.roborio)

    nativeDebug wpi.java.deps.wpilibJniDebug(wpi.platforms.desktop)
    nativeDebug wpi.java.vendor.jniDebug(wpi.platforms.desktop)
    simulationDebug wpi.sim.enableDebug()

    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease wpi.java.vendor.jniRelease(wpi.platforms.desktop)
    simulationRelease wpi.sim.enableRelease()

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    systemProperty 'junit.jupiter.extensions.autodetection.enabled', 'true'
}

// Simulation configuration (e.g. environment variables).
wpi.sim.addGui().defaultEnabled = true
wpi.sim.addDriverstation()

// Setting up my Jar File. In this case, adding all libraries into the main jar ('fat jar')
// in order to make them all available at runtime. Also adding the manifest so WPILib
// knows where to look for our Robot Class.
jar {
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    from('src') { into 'backup/src' }
    from('vendordeps') { into 'backup/vendordeps' }
    from('build.gradle') { into 'backup' }
    manifest edu.wpi.first.gradlerio.GradleRIOPlugin.javaManifest(ROBOT_MAIN_CLASS)
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

// Configure jar and deploy tasks
deployArtifact.jarTask = jar
wpi.java.configureExecutableTasks(jar)
wpi.java.configureTestTasks(test)

// Configure string concat to always inline compile
tasks.withType(JavaCompile) {
    options.compilerArgs.add '-XDstringConcat=inline'
}

def mirroredAutoSourceName = 'L.2'
def mirroredAutoOutputName = 'R.2'
def mirroredPathPrefix = "${mirroredAutoOutputName}-"
def pathPlannerDirectory = file('src/main/deploy/pathplanner')
def pathPlannerAutosDirectory = new File(pathPlannerDirectory, 'autos')
def pathPlannerPathsDirectory = new File(pathPlannerDirectory, 'paths')
def pathPlannerNavgridFile = new File(pathPlannerDirectory, 'navgrid.json')

def generateMirroredR2Auto = tasks.register('generateMirroredR2Auto') {
    group = 'pathplanner'
    description = 'Generates R.2 by mirroring L.2 across the field center line.'

    doLast {
        def jsonParser = new JsonSlurper()
        def sourceAutoFile = new File(
            pathPlannerAutosDirectory,
            "${mirroredAutoSourceName}.auto"
        )
        def outputAutoFile = new File(
            pathPlannerAutosDirectory,
            "${mirroredAutoOutputName}.auto"
        )
        def sourceAuto = jsonParser.parse(sourceAutoFile)
        def navgrid = jsonParser.parse(pathPlannerNavgridFile)
        double fieldWidthMeters = (navgrid.field_size.y as Number).doubleValue()

        def swapLeftAndRight = { String value ->
            value
                .replace('Left', '__PATHPLANNER_MIRROR_LEFT__')
                .replace('Right', 'Left')
                .replace('__PATHPLANNER_MIRROR_LEFT__', 'Right')
        }
        def mirroredPathName = { String sourcePathName ->
            "${mirroredPathPrefix}${sourcePathName}"
        }

        Closure mirrorCommandJson
        mirrorCommandJson = { value ->
            if (value instanceof Map) {
                def mirrored = new LinkedHashMap()
                value.each { key, nestedValue ->
                    if (key == 'pathName' && nestedValue instanceof String) {
                        mirrored[key] = mirroredPathName(nestedValue)
                    } else if (key == 'name' && nestedValue instanceof String) {
                        mirrored[key] = swapLeftAndRight(nestedValue)
                    } else {
                        mirrored[key] = mirrorCommandJson(nestedValue)
                    }
                }
                return mirrored
            }
            if (value instanceof List) {
                return value.collect { mirrorCommandJson(it) }
            }
            return value
        }

        Closure collectPathNames
        collectPathNames = { value, Set<String> pathNames ->
            if (value instanceof Map) {
                if (
                    value.type == 'path'
                        && value.data instanceof Map
                        && value.data.pathName instanceof String
                ) {
                    pathNames.add(value.data.pathName)
                }
                value.values().each { collectPathNames(it, pathNames) }
            } else if (value instanceof List) {
                value.each { collectPathNames(it, pathNames) }
            }
        }

        def mirrorTranslation = { translation ->
            if (translation instanceof Map) {
                translation.y = fieldWidthMeters - (translation.y as Number).doubleValue()
            }
        }
        def mirrorRotation = { state ->
            if (state instanceof Map && state.rotation instanceof Number) {
                state.rotation = -(state.rotation as Number).doubleValue()
            }
        }
        def mirrorPath = { sourcePath ->
            sourcePath.waypoints.each { waypoint ->
                mirrorTranslation(waypoint.anchor)
                mirrorTranslation(waypoint.prevControl)
                mirrorTranslation(waypoint.nextControl)
                if (waypoint.linkedName instanceof String) {
                    waypoint.linkedName = waypoint.linkedName.replaceFirst('^L', 'R')
                }
            }
            sourcePath.rotationTargets.each { rotationTarget ->
                rotationTarget.rotationDegrees = -(
                    rotationTarget.rotationDegrees as Number
                ).doubleValue()
            }
            sourcePath.pointTowardsZones.each { pointTowardsZone ->
                mirrorTranslation(pointTowardsZone.fieldPosition)
            }
            sourcePath.eventMarkers = mirrorCommandJson(sourcePath.eventMarkers)
            mirrorRotation(sourcePath.goalEndState)
            mirrorRotation(sourcePath.idealStartingState)
            sourcePath.folder = 'R'
            return sourcePath
        }
        def writeJson = { File outputFile, value ->
            outputFile.parentFile.mkdirs()
            outputFile.setText(
                JsonOutput.prettyPrint(JsonOutput.toJson(value)) + System.lineSeparator(),
                'UTF-8'
            )
        }

        Set<String> sourcePathNames = new LinkedHashSet<>()
        collectPathNames(sourceAuto.command, sourcePathNames)

        Set<File> expectedMirroredPathFiles = new LinkedHashSet<>()
        sourcePathNames.each { sourcePathName ->
            def sourcePathFile = new File(
                pathPlannerPathsDirectory,
                "${sourcePathName}.path"
            )
            if (!sourcePathFile.isFile()) {
                throw new GradleException(
                    "${mirroredAutoSourceName} references missing path ${sourcePathName}."
                )
            }

            def outputPathFile = new File(
                pathPlannerPathsDirectory,
                "${mirroredPathName(sourcePathName)}.path"
            )
            expectedMirroredPathFiles.add(outputPathFile)
            writeJson(outputPathFile, mirrorPath(jsonParser.parse(sourcePathFile)))
        }

        fileTree(pathPlannerPathsDirectory) {
            include "${mirroredPathPrefix}*.path"
        }.files.each { generatedPathFile ->
            if (!expectedMirroredPathFiles.contains(generatedPathFile)) {
                generatedPathFile.delete()
            }
        }

        def mirroredAuto = mirrorCommandJson(sourceAuto)
        mirroredAuto.folder = null
        writeJson(outputAutoFile, mirroredAuto)
    }
}

tasks.named('compileJava') {
    dependsOn generateMirroredR2Auto
}
